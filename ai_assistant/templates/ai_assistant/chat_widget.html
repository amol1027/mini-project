<!-- AI Assistant Floating Chat Widget -->
<div x-data="chatWidget()" x-cloak>
    <!-- Floating Button -->
    <button @click="toggleChat()" 
        class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all z-50 flex items-center justify-center group"
        :class="{ 'ring-4 ring-indigo-200': isOpen }">
        <svg x-show="!isOpen" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        <svg x-show="isOpen" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <!-- Notification Pulse -->
        <span x-show="!isOpen && hasNewMessage" 
            class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full animate-pulse"></span>
    </button>

    <!-- Chat Window -->
    <div x-show="isOpen" 
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95 translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 translate-y-4"
        class="fixed bottom-24 right-6 w-96 max-w-[calc(100vw-3rem)] bg-white rounded-2xl shadow-2xl z-50 overflow-hidden"
        style="max-height: calc(100vh - 150px);">
        
        <!-- Chat Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h3 class="text-white font-semibold">SRE Assistant</h3>
                    <p class="text-indigo-100 text-xs">Always here to help!</p>
                </div>
                <a href="{% url 'ai_assistant:chat' %}" class="text-white/70 hover:text-white transition-colors p-1" title="Open full chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                </a>
            </div>
        </div>
        
        <!-- Messages Container -->
        <div id="widgetMessages" class="h-80 overflow-y-auto p-4 space-y-3 custom-scrollbar" x-ref="messagesContainer">
            <!-- Welcome Message -->
            <div class="flex gap-2">
                <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="bg-gray-100 rounded-xl rounded-tl-none px-3 py-2 max-w-[85%] text-sm">
                    <p class="text-gray-800">👋 Hi! I'm your SRE Assistant. How can I help you today?</p>
                </div>
            </div>
            
            <!-- Dynamic Messages -->
            <template x-for="message in messages" :key="message.id">
                <div class="flex gap-2" :class="{ 'justify-end': message.role === 'user' }">
                    <template x-if="message.role === 'assistant'">
                        <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                    </template>
                    <div class="px-3 py-2 max-w-[85%] text-sm rounded-xl"
                        :class="message.role === 'user' 
                            ? 'bg-indigo-600 text-white rounded-tr-none' 
                            : 'bg-gray-100 text-gray-800 rounded-tl-none'">
                        <p class="whitespace-pre-wrap" x-text="message.content"></p>
                    </div>
                    <template x-if="message.role === 'user'">
                        <div class="w-7 h-7 bg-indigo-600 rounded-full flex items-center justify-center flex-shrink-0">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                    </template>
                </div>
            </template>
            
            <!-- Typing Indicator -->
            <div x-show="isTyping" class="flex gap-2">
                <div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="bg-gray-100 rounded-xl rounded-tl-none px-3 py-2">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Quick Suggestions -->
        <div class="px-4 pb-2 flex flex-wrap gap-1" x-show="messages.length === 0">
            <button @click="sendMessage('How do I list a product?')" 
                class="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full hover:bg-indigo-100 transition-colors">
                List a product
            </button>
            <button @click="sendMessage('How does borrowing work?')" 
                class="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full hover:bg-indigo-100 transition-colors">
                Borrowing
            </button>
            <button @click="sendMessage('Help')" 
                class="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full hover:bg-indigo-100 transition-colors">
                Help
            </button>
        </div>
        
        <!-- Input Area -->
        <div class="border-t border-gray-200 px-4 py-3">
            <form @submit.prevent="sendMessage()" class="flex gap-2">
                <input type="text" 
                    x-model="inputMessage"
                    @keydown.enter="sendMessage()"
                    placeholder="Type a message..." 
                    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    :disabled="isTyping">
                <button type="submit"
                    class="px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50"
                    :disabled="isTyping || !inputMessage.trim()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function chatWidget() {
    return {
        isOpen: false,
        isTyping: false,
        hasNewMessage: false,
        messages: [],
        inputMessage: '',
        messageIdCounter: 0,
        
        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen) {
                this.hasNewMessage = false;
                this.$nextTick(() => this.scrollToBottom());
            }
        },
        
        scrollToBottom() {
            const container = this.$refs.messagesContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },
        
        async sendMessage(text = null) {
            const message = text || this.inputMessage.trim();
            if (!message) return;
            
            // Add user message
            this.messages.push({
                id: ++this.messageIdCounter,
                role: 'user',
                content: message
            });
            
            this.inputMessage = '';
            this.isTyping = true;
            this.$nextTick(() => this.scrollToBottom());
            
            try {
                const response = await fetch('{% url "ai_assistant:send_message" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                this.isTyping = false;
                
                if (data.success) {
                    this.messages.push({
                        id: ++this.messageIdCounter,
                        role: 'assistant',
                        content: data.response
                    });
                } else {
                    this.messages.push({
                        id: ++this.messageIdCounter,
                        role: 'assistant',
                        content: 'Sorry, I encountered an error. Please try again.'
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                this.isTyping = false;
                this.messages.push({
                    id: ++this.messageIdCounter,
                    role: 'assistant',
                    content: 'Sorry, something went wrong. Please try again.'
                });
            }
            
            this.$nextTick(() => this.scrollToBottom());
        }
    }
}
</script>
