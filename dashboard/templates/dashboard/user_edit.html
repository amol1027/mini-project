{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header Section -->
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-900">Edit User</h2>
            <p class="mt-2 text-gray-600">Update user information{% if user.name %} for {{ user.name }}{% endif %}</p>
        </div>

        <!-- Edit Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <!-- Basic Information -->
            <div class="bg-white rounded-xl shadow-md border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900">Basic Information</h3>
                </div>
                <div class="px-6 py-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                            <input type="email" 
                                   id="email" 
                                   name="email" 
                                   value="{{ user.email }}" 
                                   required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" 
                                   id="name" 
                                   name="name" 
                                   value="{{ user.name|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="college_id" class="block text-sm font-medium text-gray-700 mb-1">College ID *</label>
                            <input type="text" 
                                   id="college_id" 
                                   name="college_id" 
                                   value="{{ user.college_id }}" 
                                   required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="rating" class="block text-sm font-medium text-gray-700 mb-1">Rating (0-5)</label>
                            <input type="number" 
                                   id="rating" 
                                   name="rating" 
                                   value="{{ user.rating }}" 
                                   min="0" 
                                   max="5"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="college_name" class="block text-sm font-medium text-gray-700 mb-1">College Name</label>
                            <input type="text" 
                                   id="college_name" 
                                   name="college_name" 
                                   value="{{ user.college_name|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="university_name" class="block text-sm font-medium text-gray-700 mb-1">University Name</label>
                            <input type="text" 
                                   id="university_name" 
                                   name="university_name" 
                                   value="{{ user.university_name|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <!-- Account Status Checkboxes -->
                    <div class="pt-4 border-t border-gray-200">
                        <div class="space-y-3">
                            <div class="flex items-center">
                                <input type="hidden" name="email_verified" value="off">
                                <input type="checkbox" 
                                       id="email_verified" 
                                       name="email_verified" 
                                       value="on"
                                       {% if user.email_verified %}checked{% endif %}
                                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                <label for="email_verified" class="ml-2 text-sm font-medium text-gray-700">Email Verified</label>
                            </div>
                            <div class="flex items-center">
                                <input type="hidden" name="is_admin" value="off">
                                <input type="checkbox" 
                                       id="is_admin" 
                                       name="is_admin" 
                                       value="on"
                                       {% if user.is_admin %}checked{% endif %}
                                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                <label for="is_admin" class="ml-2 text-sm font-medium text-gray-700">Admin User</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Address Information -->
            <div class="bg-white rounded-xl shadow-md border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900">Address Information</h3>
                </div>
                <div class="px-6 py-6 space-y-4">
                    <div>
                        <label for="address_line1" class="block text-sm font-medium text-gray-700 mb-1">Address Line 1</label>
                        <input type="text" 
                               id="address_line1" 
                               name="address_line1" 
                               value="{{ user.address_line1|default:'' }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <label for="address_line2" class="block text-sm font-medium text-gray-700 mb-1">Address Line 2</label>
                        <input type="text" 
                               id="address_line2" 
                               name="address_line2" 
                               value="{{ user.address_line2|default:'' }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
                            <input type="text" 
                                   id="city" 
                                   name="city" 
                                   value="{{ user.city|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="state_province" class="block text-sm font-medium text-gray-700 mb-1">State/Province</label>
                            <input type="text" 
                                   id="state_province" 
                                   name="state_province" 
                                   value="{{ user.state_province|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="zip_postal_code" class="block text-sm font-medium text-gray-700 mb-1">ZIP/Postal Code</label>
                            <input type="text" 
                                   id="zip_postal_code" 
                                   name="zip_postal_code" 
                                   value="{{ user.zip_postal_code|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="country" class="block text-sm font-medium text-gray-700 mb-1">Country</label>
                            <input type="text" 
                                   id="country" 
                                   name="country" 
                                   value="{{ user.country|default:'' }}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                <div class="flex flex-wrap gap-4">
                    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
                        Save Changes
                    </button>
                    <a href="{% url 'dashboard:user_detail' user.id %}" class="px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </main>
</div>
{% endblock %}
