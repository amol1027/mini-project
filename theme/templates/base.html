{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>Student Resource Exchange</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% tailwind_css %}
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.0/dist/cdn.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        [x-cloak] { display: none !important; }
        
        /* Mobile menu visibility */
    /* x-cloak hides elements until Alpine initializes. Keep only x-cloak. */
        
        /* Fade in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        /* Card hover effect */
        .feature-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.15), 
                        0 10px 10px -5px rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        /* Button hover effects */
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        
        /* Smooth transitions */
        a, button {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>

<body class="bg-white text-gray-800 antialiased">

    {% block content %}
    {% endblock %}
    
    <!-- Vanilla JS Fallback for Mobile Menu -->
    <script>
        // Fallback if Alpine.js doesn't load
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for Alpine to initialize
            setTimeout(function() {
                if (typeof window.Alpine === 'undefined') {
                    console.log('Alpine.js not detected, using vanilla JS fallback');
                    
                    const menuButton = document.querySelector('[data-mobile-menu-button]');
                    const closeButton = document.querySelector('[data-mobile-menu-close]');
                    const mobileMenu = document.querySelector('[data-mobile-menu]');
                    const backdrop = document.querySelector('[data-mobile-menu-backdrop]');
                    const menuLinks = document.querySelectorAll('[data-mobile-menu-link]');
                    const menuPanel = document.querySelector('[data-mobile-menu-panel]');
                    
                    if (menuButton && menuPanel) {
                        // Initialize menu as hidden
                        menuPanel.style.display = 'none';
                        
                        menuButton.addEventListener('click', function() {
                            const isHidden = menuPanel.style.display === 'none';
                            menuPanel.style.display = isHidden ? 'block' : 'none';
                            // Also toggle the parent menu visibility
                            mobileMenu.style.display = isHidden ? 'block' : 'none';
                        });
                        
                        if (closeButton) {
                            closeButton.addEventListener('click', function() {
                                menuPanel.style.display = 'none';
                                mobileMenu.style.display = 'none';
                            });
                        }
                        
                        if (backdrop) {
                            backdrop.addEventListener('click', function() {
                                menuPanel.style.display = 'none';
                                mobileMenu.style.display = 'none';
                            });
                        }
                        
                        menuLinks.forEach(function(link) {
                            link.addEventListener('click', function() {
                                menuPanel.style.display = 'none';
                                mobileMenu.style.display = 'none';
                            });
                        });
                    }
                }
            }, 100);
        });

        // Auto-dismiss messages after 5 seconds with smooth animation
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('[role="alert"]');
            messages.forEach(function(message) {
                // Add a close button to each message
                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '&times;';
                closeBtn.className = 'ml-auto text-2xl font-bold leading-none hover:opacity-75 transition-opacity';
                closeBtn.style.cssText = 'background: none; border: none; cursor: pointer; padding: 0 0 0 12px;';
                closeBtn.setAttribute('aria-label', 'Close');
                
                // Add close button to message
                const messageContent = message.querySelector('div');
                if (messageContent) {
                    messageContent.appendChild(closeBtn);
                }
                
                // Function to dismiss message
                function dismissMessage() {
                    message.style.transition = 'all 0.5s ease-out';
                    message.style.opacity = '0';
                    message.style.transform = 'translateY(-10px)';
                    setTimeout(function() {
                        message.remove();
                    }, 500);
                }
                
                // Close button click handler
                closeBtn.addEventListener('click', dismissMessage);
                
                // Auto-dismiss after 5 seconds
                setTimeout(dismissMessage, 5000);
            });
        });
    </script>

</body>
</html>
